<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StageWhisper – Settings</title>
    <script>
      (function () {
        var t = localStorage.getItem("stagewhisper-theme");
        if (t !== "light" && t !== "dark")
          t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.setAttribute("data-theme", t);
        document.documentElement.style.background = t === "dark" ? "#0a0a0a" : "#f5f0ec";
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/windows/settings.tsx"></script>
  </body>
</html>
