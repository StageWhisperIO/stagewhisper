[package]
name = "stagewhisper-lite"
version = "0.1.0"
description = "StageWhisper Lite"
authors = ["you"]
edition = "2021"

[lib]
name = "stagewhisper_lite_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = []
diarization = ["sw-audio-recording/diarization"]
reference-gate = ["sw-audio-recording/reference-gate"]

[workspace]
members = ["sw-audio-recording", "sw-crypto", "sw-notes", "sw-local-llm"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
sw-audio-recording = { path = "./sw-audio-recording" }
sw-crypto = { path = "./sw-crypto" }
sw-notes = { path = "./sw-notes" }
sw-local-llm = { path = "./sw-local-llm" }
sw-reply-stream = { path = "../../stagewhisper-desktop/src-tauri/sw-reply-stream" }
sw-pairing = { path = "../../stagewhisper-desktop/src-tauri/sw-pairing" }

tauri = { version = "2", features = ["macos-private-api", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-log = "2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.43.0", features = ["macros", "rt", "rt-multi-thread", "sync", "time", "net"] }
base64 = "0.22.1"
reqwest = { version = "0.12.12", default-features = false, features = ["json", "rustls-tls", "blocking", "stream"] }
window-vibrancy = "0.7.1"
chrono = { version = "0.4", features = ["serde"] }
crossbeam-channel = "0.5"
getrandom = "0.3"
dirs = "6"
anyhow = "1"
hex = "0.4"
zeroize = "1"

[target.'cfg(target_vendor = "apple")'.dependencies]
security-framework = "3"
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString"] }
tauri-nspanel = { git = "https://github.com/ahkohd/tauri-nspanel", branch = "v2.1" }

[target.'cfg(windows)'.dependencies]
tauri = { version = "2", features = ["tray-icon"] }
sw-device-key = { path = "../../stagewhisper-desktop/src-tauri/sw-device-key" }
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Accessibility",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Security_Credentials",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_System_Com",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
    "Win32_System_JobObjects",
    "Win32_System_Registry",
    "Win32_Storage_FileSystem",
    "Media_Capture",
    "Media_Devices",
    "Devices_Enumeration",
    "Foundation",
    "Foundation_Collections",
    "Security_Authorization_AppCapabilityAccess",
] }

[dependencies.uuid]
version = "1.22.0"
features = [
    "v4",
    "serde",
]

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-updater = "2"

[dev-dependencies]
tokio = { version = "1.43.0", features = ["test-util"] }
