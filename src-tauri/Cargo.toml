[package]
name = "stagewhisper-lite"
version = "0.1.0"
description = "StageWhisper Lite"
authors = ["you"]
edition = "2021"

[lib]
name = "stagewhisper_lite_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[workspace]
members = ["sw-audio-recording", "sw-crypto", "sw-notes", "sw-local-llm"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
sw-audio-recording = { path = "./sw-audio-recording" }
sw-crypto = { path = "./sw-crypto" }
sw-notes = { path = "./sw-notes" }
sw-local-llm = { path = "./sw-local-llm" }

tauri = { version = "2", features = ["macos-private-api", "image-png"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.43.0", features = ["macros", "rt", "rt-multi-thread", "sync", "time", "net"] }
base64 = "0.22.1"
reqwest = { version = "0.12.12", default-features = false, features = ["json", "rustls-tls", "blocking", "stream"] }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
subtle = "2"
tauri-nspanel = { git = "https://github.com/ahkohd/tauri-nspanel", branch = "v2.1" }
window-vibrancy = "0.7.1"
chrono = { version = "0.4", features = ["serde"] }
crossbeam-channel = "0.5"
getrandom = "0.3"
dirs = "6"
anyhow = "1"
hex = "0.4"
zeroize = "1"

[target.'cfg(target_vendor = "apple")'.dependencies]
security-framework = "3"
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString"] }

[dependencies.uuid]
version = "1.22.0"
features = [
    "v4",
    "serde",
]

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-updater = "2"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
