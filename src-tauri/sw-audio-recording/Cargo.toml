[package]
name = "sw-audio-recording"
version = "0.1.0"
edition = "2021"

[features]
default = []
vocab-boost = []
diarization = ["dep:sherpa-rs", "dep:sw-crypto"]
ilat = []

[dependencies]
cpal = "0.17.1"
hound = "3.5.1"
log = "0.4.29"

ort = "2.0.0-rc.12"
ndarray = "0.16"
realfft = "3"
sha2 = "0.10"
dirs = "6"
anyhow = "1"
reqwest = { version = "0.12", features = ["stream"] }
futures-util = "0.3"
tokio = { version = "1", features = ["rt", "macros", "fs", "io-util"] }
crossbeam-channel = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

sherpa-rs = { version = "0.6.8", default-features = false, features = ["download-binaries"], optional = true }
sw-crypto = { path = "../sw-crypto", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["net", "time"] }

[target.'cfg(target_os = "macos")'.dependencies]
coreaudio-sys = "0.2"
libc = "0.2"
block2 = "0.6"
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSString", "NSValue"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFBase", "CFArray", "CFDictionary", "CFNumber", "CFString"] }
objc2-core-audio = { version = "0.3", default-features = false, features = ["std", "AudioHardware", "objc2", "objc2-foundation", "objc2-core-audio-types"] }
objc2-core-audio-types = { version = "0.3", default-features = false, features = ["std", "CoreAudioBaseTypes"] }

[target.'cfg(target_vendor = "apple")'.dependencies]
ort = { version = "2.0.0-rc.12", features = ["coreml"] }

[target.'cfg(windows)'.dependencies]
ort = { version = "2.0.0-rc.12", features = ["directml"] }
windows = { version = "0.62", features = [
    "Win32_Devices_FunctionDiscovery",
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_UI_Shell_PropertiesSystem",
] }
windows-core = "0.62"
