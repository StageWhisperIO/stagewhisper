[package]
name = "sw-notes"
version = "0.1.0"
edition = "2021"

[dependencies]
sw-crypto = { path = "../sw-crypto" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "v5", "serde"] }
thiserror = "2"
tokio = { version = "1.43.0", features = ["time"] }
text-splitter = "0.16"

[dev-dependencies]
tokio = { version = "1.43.0", features = ["macros", "rt"] }
